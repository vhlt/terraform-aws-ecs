name: Terraform github runner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      ACTION: ${{ github.event.inputs.action }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_STS_ROLE_TOOLING }}

      - name: Fetch Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          SECRET_NAME="$ENVIRONMENT-tfvars"
          aws secretsmanager get-secret-value --secret-id $SECRET_NAME --query SecretString --output text > secret.json

      - name: Convert JSON to TFVars
        run: |
          # Convert JSON to TFVars
          jq -r 'to_entries | .[] | "\(.key) = \(.value | if type=="array" then tostring else @json end)"' secret.json > env/$ENVIRONMENT.tfvars

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.3

      - name: Terraform Init
        run: terraform init -upgrade --reconfigure -backend=true -backend-config=env/backend-$ENVIRONMENT.hcl

      - name: Terraform Plan
        if: ${{ env.ACTION == 'plan' }}
        id: plan
        run: terraform plan -out=plan-$ENVIRONMENT.tfplan -var-file=env/$ENVIRONMENT.tfvars

      - name: Upload Terraform Plan to S3
        if: ${{ env.ACTION == 'plan' }}
        run: aws s3 cp plan-$ENVIRONMENT.tfplan s3://${{ secrets.AWS_S3_BUCKET_NAME }}/plan-$ENVIRONMENT.tfplan

      - name: Download Terraform Plan from S3
        if: ${{ env.ACTION == 'apply' }}
        run: aws s3 cp s3://${{ secrets.AWS_S3_BUCKET_NAME }}/plan-$ENVIRONMENT.tfplan plan-$ENVIRONMENT.tfplan

      - name: Terraform Apply
        if: ${{ env.ACTION == 'apply' }}
        run: terraform apply plan-$ENVIRONMENT.tfplan